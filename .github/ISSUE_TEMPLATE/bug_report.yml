name: Bug report
description: Report a reproducible problem with the Dev Container or helper CLI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact commands or actions.
      placeholder: |
        1. Open Dev Container
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: host-os
    attributes:
      label: Host OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor or terminal workflow
      placeholder: VS Code Dev Containers, Cursor, IntelliJ IDEA, terminal
    validations:
      required: true
  - type: input
    id: sdk-profile
    attributes:
      label: Android SDK profile
      placeholder: base, native, emulator-assets
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: Paste the relevant output or provide the `.android-dev/logs/` path.
      render: shell
  - type: dropdown
    id: device
    attributes:
      label: Device workflow
      options:
        - Physical phone over wireless debugging
        - Physical phone over USB
        - Host emulator
        - Container-managed emulator
        - Not device related
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that may help.
