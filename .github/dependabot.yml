version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    ignore:
      # The Android baseline intentionally stays on JDK 17 for broad Android
      # Gradle Plugin compatibility. Review base JDK upgrades manually.
      - dependency-name: "eclipse-temurin"
